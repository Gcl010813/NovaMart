name: NovaMart Performance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  k6-perf-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Start Docker Compose services (wait until healthy)
        run: docker compose up -d --build --wait --wait-timeout 120

      # 第 3 步：等待 MySQL/RabbitMQ 的循环逻辑已删除，--wait 已覆盖

      - name: 3. Run k6 Performance Tests (Performance Gate)
        run: |
          docker run --rm --network host --user $(id -u):$(id -g) -v $PWD:/scripts -w /scripts grafana/k6 run k6/read-test.js
          docker run --rm --network host --user $(id -u):$(id -g) -v $PWD:/scripts -w /scripts grafana/k6 run k6/sync-order-test.js
          docker run --rm --network host --user $(id -u):$(id -g) -v $PWD:/scripts -w /scripts grafana/k6 run k6/async-order-test.js

      - name: 4. Upload HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-html-reports
          path: k6/reports/

      - name: 5. Tear down Docker Compose
        if: always()
        run: docker compose down -v