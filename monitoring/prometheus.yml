global:
  scrape_interval: 5s # 每5秒抓取一次

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'nova-app'
    static_configs:
      - targets: ['app:3000'] # 抓取 Node 应用的业务指标